name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: your-gcp-project-id
        service_account_key: ${{ secrets.AIzaSyAMFEvHXgkEc82InqTXjp7Jq1R2_HvJfMo }}
        export_default_credentials: true

    - name: Build and push Docker image
      run: |
        gcloud builds submit --tag gcr.io/your-gcp-project-id/your-app-name

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy your-app-name \
          --image gcr.io/your-gcp-project-id/your-app-name \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated
