  name: CI/CD Pipeline

  on:
    push:
      branches:
        - main

  jobs:
    build-test-deploy:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Set up Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '18'

        - name: Install dependencies
          run: npm install

        - name: Run tests
          run: npm test

        - name: Deploy to AWS EC2 (example)
          env:
            PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
            HOST: ${{ secrets.EC2_HOST }}
            USER: ubuntu
          run: |
            echo "$PRIVATE_KEY" > key.pem
            chmod 600 key.pem
            ssh -o StrictHostKeyChecking=no -i key.pem $USER@$HOST "cd /app && git pull && pm2 restart all"
